# The rooms Worker: async and realtime play. Deployed independently of the game page, from
# inside this directory (`npx wrangler deploy`). Needs the Workers paid plan for Durable Objects.
# Named distinctly from the Pages project so the two can never be confused at deploy time.
name = "kanche-rooms"
main = "kanche-worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
