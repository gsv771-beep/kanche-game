# Cloudflare Pages project for the game page. public/ IS the site -- no build step, no bundler.
# This name must match the Pages project you create in the dashboard, or `npm run deploy`
# will push to the wrong project (or create a stray one).
name = "kanche-game"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

# Online play is a SEPARATE Worker with its own Durable Object binding -- see worker/wrangler.toml.
# Keeping it separate means the game page stays a pure static deploy that costs nothing and
# cannot be broken by a bad Worker deploy.
